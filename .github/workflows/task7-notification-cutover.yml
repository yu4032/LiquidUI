name: Task 7 notification adapter cutover

on:
  push:
    branches:
      - 'feature/task7-notification-adapter-cutover'

permissions:
  contents: write

concurrency:
  group: task7-notification-adapter-cutover
  cancel-in-progress: true

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never
          gradle-version: '9.6.1'

      - name: Apply minimal Task 7 GREEN
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one old fragment, found {count}')
              p.write_text(source.replace(old, new, 1))

          hook_path = 'src/main/java/com/hellovoid/liquidui/glass/notification/NotificationSharedGlassHook.java'
          replace_once(
              hook_path,
              'import com.hellovoid.liquidui.hook.SystemUiHook;\n',
              'import com.hellovoid.liquidui.hook.SystemUiHook;\n'
              'import com.hellovoid.liquidui.glass.core.SystemUiGlassCore;\n',
              'hook core import')
          replace_once(
              hook_path,
              '    private final ArgumentRewriteHookBackend argumentBackend;\n'
              '    private final boolean enabled;\n',
              '    private final ArgumentRewriteHookBackend argumentBackend;\n'
              '    private final SystemUiGlassCore glassCore;\n'
              '    private final boolean enabled;\n',
              'hook core field')
          replace_once(
              hook_path,
              '            AfterMethodHookBackend afterBackend,\n'
              '            ArgumentRewriteHookBackend argumentBackend,\n'
              '            boolean enabled) {\n'
              '        this.beforeBackend = Objects.requireNonNull(beforeBackend, "beforeBackend");\n'
              '        this.afterBackend = Objects.requireNonNull(afterBackend, "afterBackend");\n'
              '        this.argumentBackend = Objects.requireNonNull(argumentBackend, "argumentBackend");\n'
              '        this.enabled = enabled;\n',
              '            AfterMethodHookBackend afterBackend,\n'
              '            ArgumentRewriteHookBackend argumentBackend,\n'
              '            SystemUiGlassCore glassCore,\n'
              '            boolean enabled) {\n'
              '        this.beforeBackend = Objects.requireNonNull(beforeBackend, "beforeBackend");\n'
              '        this.afterBackend = Objects.requireNonNull(afterBackend, "afterBackend");\n'
              '        this.argumentBackend = Objects.requireNonNull(argumentBackend, "argumentBackend");\n'
              '        this.glassCore = Objects.requireNonNull(glassCore, "glassCore");\n'
              '        this.enabled = enabled;\n',
              'hook constructor')
          replace_once(
              hook_path,
              '            runtime = new NotificationGlassRuntime(\n'
              '                    stackClass, collector, presentationController, activityState, authorityState);\n',
              '            runtime = new NotificationGlassRuntime(\n'
              '                    glassCore, stackClass, collector, presentationController,\n'
              '                    activityState, authorityState);\n',
              'hook runtime injection')
          replace_once(
              hook_path,
              '            // with the one-per-NSSL shared renderer. No standalone GpuStream probe is instantiated.\n',
              '            // with the Window-shared adapter. No standalone GpuStream probe is instantiated.\n',
              'hook ownership comment')

          renderer = Path('src/main/java/com/hellovoid/liquidui/glass/core/WindowGlassRenderer.java')
          source = renderer.read_text()
          replacements = {
              'private volatile int topSamplingExtraPx;':
                  'private volatile int topSamplingExtraPx = Integer.MIN_VALUE;',
              'private volatile int bottomSamplingExtraPx;':
                  'private volatile int bottomSamplingExtraPx = Integer.MIN_VALUE;',
              'private volatile int leftSamplingExtraPx;':
                  'private volatile int leftSamplingExtraPx = Integer.MIN_VALUE;',
              'private volatile int rightSamplingExtraPx;':
                  'private volatile int rightSamplingExtraPx = Integer.MIN_VALUE;',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one renderer declaration: {old!r}')
              source = source.replace(old, new, 1)
          renderer.write_text(source)

          collector = Path('src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGlassNodeCollector.java')
          source = collector.read_text()
          start_marker = '    /** Temporary compile bridge for the pre-Task-7 session; deleted with legacy scene types. */\n'
          end_marker = '    int visualZOrder(Object rowObject) {'
          start = source.find(start_marker)
          end = source.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('legacy collector bridge markers not found')
          collector.write_text(source[:start] + source[end:])
          PY

          rm -f \
            src/main/java/com/hellovoid/liquidui/glass/notification/Miuix307BackdropMapping.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/Miuix307PassBlurShaders.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/Miuix307PrismalCompositeShaders.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGlassCompositor.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGlassHostView.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGlassMaterial.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGlassNode.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGlassPresentationState.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGlassSceneSnapshot.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGlassSceneState.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGlassSession.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationGpuPassBlurStreamProbe.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationPassBlurTextureView.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationPrismalPerformanceTuner.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationViewRootSurfaceObserver.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/NotificationZeroSamplingPolicy.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/SystemUiPassBlurBridge.java \
            src/main/java/com/hellovoid/liquidui/glass/notification/ZeroCopyProducerRecoveryState.java \
            src/test/java/com/hellovoid/liquidui/glass/notification/NotificationGlassPresentationStateContractTest.java

          rm -f scripts/task7-core-parity.patch scripts/task7-notification-hook.patch
          rm -f .github/workflows/task7-notification-cutover.yml

      - name: Verify SDK-independent contracts
        run: ./scripts/test-contracts.sh

      - name: Verify Android unit tests and APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Verify ownership invariants
        shell: bash
        run: |
          set -euo pipefail
          NOTIF=src/main/java/com/hellovoid/liquidui/glass/notification
          ! grep -R -nE 'EGL14\.|GL_TEXTURE_EXTERNAL_OES|new SurfaceTexture\(|new PrismalRenderer\(|SetPassBlurSurface|glReadPixels|PixelCopy' "$NOTIF"
          test "$(grep -o 'new SystemUiGlassCore(' src/main/java/com/hellovoid/liquidui/ModuleMain.java | wc -l)" -eq 1
          grep -q 'SystemUiGlassCore glassCore' "$NOTIF/NotificationSharedGlassHook.java"
          grep -q 'glassCore, stackClass, collector' "$NOTIF/NotificationSharedGlassHook.java"
          ! grep -R -n 'NotificationGlassSession' "$NOTIF"
          git diff --check

      - name: Commit verified cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cutover changes to commit'
            exit 0
          fi
          git commit -m 'refactor: migrate notifications to shared window glass'
          git push origin HEAD:feature/task7-notification-adapter-cutover
