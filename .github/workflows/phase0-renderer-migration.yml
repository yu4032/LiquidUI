name: Phase 0 Window renderer migration

on:
  push:
    branches:
      - feature/systemui-wide-shared-glass

permissions:
  contents: write
  actions: read

jobs:
  migrate-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration state
        id: detect
        shell: bash
        run: |
          target='src/main/java/com/hellovoid/liquidui/glass/core/WindowGlassRenderer.java'
          if [[ -f "$target" ]]; then
            echo 'generate=false' >> "$GITHUB_OUTPUT"
            echo 'WindowGlassRenderer already exists; migration is complete.'
          else
            echo 'generate=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download validated source snapshot
        if: steps.detect.outputs.generate == 'true'
        uses: actions/download-artifact@v4
        with:
          name: LiquidUI-build-source
          path: .phase0-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34116288624

      - name: Generate generic Window renderer
        if: steps.detect.outputs.generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_file='.phase0-source/main/java/com/hellovoid/liquidui/glass/notification/NotificationPassBlurTextureView.java'
          target='src/main/java/com/hellovoid/liquidui/glass/core/WindowGlassRenderer.java'
          test -f "$source_file"
          mkdir -p "$(dirname "$target")"
          cp "$source_file" "$target"
          patch -p1 < scripts/window-renderer-phase0.patch
          patch -p1 < scripts/window-renderer-phase0-fix.patch
          echo '3bff690f34ea927a482d8f48188c41b706adbe1ebf899cf0d6b41f4d07da05c8  src/main/java/com/hellovoid/liquidui/glass/core/WindowGlassRenderer.java' | sha256sum -c -
          ! grep -q 'new HandlerThread(' "$target"
          ! grep -q 'AtomicBoolean drawRequested' "$target"
          ! grep -q 'NotificationPassBlurTextureView' "$target"
          ! grep -q 'Miuix307' "$target"
          grep -q 'frameCoordinator.requestSourceFrame()' "$target"
          grep -q 'frameCoordinator.requestScene()' "$target"
          grep -q 'new GlassActivationToken(' "$target"

      - name: Run SDK-independent contracts
        if: steps.detect.outputs.generate == 'true'
        run: ./scripts/test-contracts.sh

      - name: Set up JDK
        if: steps.detect.outputs.generate == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.detect.outputs.generate == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Verify generated renderer and assemble
        if: steps.detect.outputs.generate == 'true'
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Commit verified renderer
        if: steps.detect.outputs.generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/hellovoid/liquidui/glass/core/WindowGlassRenderer.java
          git commit -m 'refactor: add generic Window glass renderer'
          git push origin "HEAD:${GITHUB_REF_NAME}"
