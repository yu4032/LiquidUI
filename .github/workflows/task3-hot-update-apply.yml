name: Task3 hot update apply

on:
  push:
    branches: [ feature/systemui-glass-customization ]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply Task3 hot update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply renderer hot-update cutover
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('src/main/java/com/hellovoid/liquidui/glass/core/WindowGlassRenderer.java')
          s = renderer.read_text()
          old = 'import com.hellovoid.liquidui.Api101Bridge;\n'
          new = old + 'import com.hellovoid.liquidui.config.GlassStyleConfig;\n'
          assert s.count(old) == 1
          assert 'import com.hellovoid.liquidui.config.GlassStyleConfig;' not in s
          s = s.replace(old, new, 1)

          needle = '''    void requestScene() {
'''
          method = '''    void updateGlassStyles(GlassStyleConfig style, long version) {
        if (shuttingDown || style == null) return;
        if (!materialProfiles.update(style, version)) return;

        portablePrismalParams = materialProfiles.paramsFor(GlassMaterialProfile.CARD);
        if (style.samplingAutoEnabled()) {
            topSamplingExtraPx = style.samplingExtraTopPx();
            bottomSamplingExtraPx = style.samplingExtraBottomPx();
            leftSamplingExtraPx = style.samplingExtraLeftPx();
            rightSamplingExtraPx = style.samplingExtraRightPx();
        } else {
            topSamplingExtraPx = Integer.MIN_VALUE;
            bottomSamplingExtraPx = Integer.MIN_VALUE;
            leftSamplingExtraPx = Integer.MIN_VALUE;
            rightSamplingExtraPx = Integer.MIN_VALUE;
        }

        Set<String> revoked = presentationState.styleVersion(version);
        dispatchPresentation(Set.of(), revoked);
        preparedBackdropReady = false;
        preparedBackdropSnapshot = null;
        updateBackdropMapping();
        frameCoordinator.requestScene();
    }

    void requestScene() {
'''
          assert s.count(needle) == 1
          assert 'void updateGlassStyles(GlassStyleConfig style, long version)' not in s
          s = s.replace(needle, method, 1)

          old_guard = '                if (!consumedFreshSource && !sourcePending) return;\n'
          new_guard = '                if (!consumedFreshSource && !sourcePending && !scenePending) return;\n'
          assert s.count(old_guard) == 1
          s = s.replace(old_guard, new_guard, 1)
          renderer.write_text(s)

          harness = Path('scripts/test-contracts.sh')
          h = harness.read_text()
          stub = '    public WindowKey key() { return key; }\n'
          replacement = stub + '    public void updateGlassStyles(com.hellovoid.liquidui.config.GlassStyleConfig style, long version) {}\n'
          assert h.count(stub) == 1
          assert 'public void updateGlassStyles(com.hellovoid.liquidui.config.GlassStyleConfig style, long version)' not in h
          h = h.replace(stub, replacement, 1)
          harness.write_text(h)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run contracts
        run: ./scripts/test-contracts.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          gradle-version: '9.6.1'
      - name: Run full build
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Commit verified Task3 cutover
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java/com/hellovoid/liquidui/glass/core/WindowGlassRenderer.java scripts/test-contracts.sh
          git commit -m 'feat: hot update shared SystemUI glass styles [task3-bot]'
          git push origin HEAD:feature/systemui-glass-customization
