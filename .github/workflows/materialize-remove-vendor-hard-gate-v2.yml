name: Materialize source-driven notification glass bind
on:
  push:
    branches:
      - staging/remove-vendor-passblur-hard-gate-v2
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply asserted patcher
        run: python3 .gatefix/apply.py
      - name: Run contracts
        run: ./scripts/test-contracts.sh
      - name: Commit materialized tree
        shell: bash
        run: |
          rm -rf .gatefix
          rm -f .github/workflows/materialize-remove-vendor-hard-gate-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bind notification glass from RTDA source independently'
          git push
