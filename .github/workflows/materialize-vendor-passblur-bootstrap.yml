name: Materialize vendor PassBlur bootstrap fix
on:
  push:
    branches: ["staging/vendor-passblur-bootstrap"]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply exact patch
        run: |
          printf '%s' '' | base64 -d > /tmp/vendor-passblur-bootstrap.patch
          git apply /tmp/vendor-passblur-bootstrap.patch
      - name: Run contracts
        run: ./scripts/test-contracts.sh
      - name: Commit materialized tree
        run: |
          rm -f .github/workflows/materialize-vendor-passblur-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bootstrap notification PassBlur gate from provider state'
          git push
